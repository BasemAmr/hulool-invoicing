services:
  db:
    image: postgres:16-alpine
    container_name: hulool-invoicing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hulool_local
      POSTGRES_DB: hulool_invoicing
    ports:
      - "5432:5432"
    volumes:
      - hulool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hulool_invoicing"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hulool_pgdata: